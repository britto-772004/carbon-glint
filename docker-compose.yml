# Local Postgres for development. Deployed environments use Neon.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: carbon
      POSTGRES_PASSWORD: carbon
      POSTGRES_DB: carbon_glint
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carbon -d carbon_glint']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
