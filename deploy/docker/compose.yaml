# Carbon Glint — self-hosted stack (any cloud / any Docker host).
#   cp deploy/docker/.env.example deploy/docker/.env   # then edit secrets
#   docker compose -f deploy/docker/compose.yaml --env-file deploy/docker/.env up -d
# Open http://localhost:8080 (put a TLS proxy / load balancer in front for production).
name: carbon-glint

x-api: &api
  image: ${CARBON_GLINT_API_IMAGE:-ghcr.io/britto-772004/carbon-glint-api:latest}
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile
  environment:
    NODE_ENV: production
    APP_URL: ${APP_URL:-http://localhost:8080}
    DATABASE_URL: postgres://carbon:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/carbon_glint
    REDIS_URL: redis://redis:6379
    SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
    LLM_MODEL: ${LLM_MODEL:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASS: ${SMTP_PASS:-}
    MAIL_FROM: ${MAIL_FROM:-Carbon Glint <no-reply@example.com>}
    SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
    SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
    DEFRA_YEAR: ${DEFRA_YEAR:-2026}
  volumes:
    - files:/data
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    environment:
      POSTGRES_USER: carbon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: carbon_glint
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carbon -d carbon_glint']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.6-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '128mb', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: migrations, emission factor library (DEFRA), super admin seed.
  setup:
    <<: *api
    command: ['node', 'dist/setup.js']
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: 'no'

  api:
    <<: *api
    depends_on:
      setup: { condition: service_completed_successfully }

  worker:
    <<: *api
    command: ['node', '--enable-source-maps', 'dist/worker.js']
    healthcheck:
      disable: true
    depends_on:
      setup: { condition: service_completed_successfully }

  web:
    image: ${CARBON_GLINT_WEB_IMAGE:-ghcr.io/britto-772004/carbon-glint-web:latest}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      - '${HTTP_PORT:-8080}:80'
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # Optional: catch all email locally (`--profile mail`), then set SMTP_HOST=mailpit and SMTP_PORT=1025.
  mailpit:
    image: axllent/mailpit:v1.34
    profiles: [mail]
    ports:
      - '8025:8025'

volumes:
  pgdata:
  redisdata:
  files:
