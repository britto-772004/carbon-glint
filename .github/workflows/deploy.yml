name: Deploy

# Builds a release on GitHub's runner, then SSHes into the e2-micro VM and activates it with pm2.
# One-time setup: apps/infra/README.md
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy API + web to VM
    runs-on: ubuntu-24.04 # same Ubuntu/glibc as the VM image, so native modules match
    environment: production
    env:
      RELEASE_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate

      - name: Build API bundle (prod dependencies only)
        run: |
          pnpm --filter @carbon-glint/api run build
          pnpm --filter @carbon-glint/api deploy --prod --legacy release/api
      - name: Build web
        env:
          VITE_API_BASE_URL: /api
        run: |
          pnpm --filter @carbon-glint/web run build
          cp -r apps/web/dist release/web
      - name: Assemble release
        run: |
          cp apps/infra/deploy/ecosystem.config.cjs apps/infra/deploy/Caddyfile release/
          mkdir -p release/scripts && cp apps/infra/scripts/*.sh release/scripts/
          tar -czf "carbon-glint-$RELEASE_ID.tgz" -C release .
          ls -lh "carbon-glint-$RELEASE_ID.tgz"

      - name: Write production .env from secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_EMBEDDING_MODEL: ${{ vars.OPENAI_EMBEDDING_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_EMBEDDING_BASE_URL: ${{ vars.OPENAI_EMBEDDING_BASE_URL }}
          APP_URL: ${{ vars.APP_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          SUPERADMIN_EMAIL: ${{ secrets.SUPERADMIN_EMAIL }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: node apps/infra/scripts/write-env.mjs > carbon-glint.env

      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$VM_KNOWN_HOSTS" ]; then printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts;
          else ssh-keyscan -T 15 -H "$VM_HOST" > ~/.ssh/known_hosts; fi
          cat > ~/.ssh/config <<CFG
          Host vm
            HostName $VM_HOST
            User ${{ secrets.VM_USER || 'deploy' }}
            IdentityFile ~/.ssh/id_deploy
            ServerAliveInterval 30
          CFG

      - name: Wait for VM bootstrap (first boot installs Node, Postgres, Redis, Caddy, pm2)
        run: |
          for i in $(seq 1 60); do
            if ssh vm 'command -v pm2 >/dev/null && systemctl is-active --quiet postgresql redis-server caddy'; then exit 0; fi
            echo "waiting for bootstrap ($i/60)…"; sleep 10
          done
          echo "VM bootstrap did not finish — see /var/log/carbon-glint-bootstrap.log on the VM" >&2; exit 1

      - name: Upload and activate release
        run: |
          scp "carbon-glint-$RELEASE_ID.tgz" carbon-glint.env apps/infra/scripts/deploy-release.sh vm:/tmp/
          ssh vm "bash /tmp/deploy-release.sh $RELEASE_ID"

      - name: Seed super admin (idempotent)
        run: ssh vm 'cd /opt/carbon-glint/current/api && node --env-file=/opt/carbon-glint/shared/.env dist/seed-superadmin.js || true'

      - name: Public URL
        run: |
          URL="$(ssh vm '/usr/local/bin/carbon-glint-tunnel-url' || true)"
          echo "### 🚀 Deployed \`${RELEASE_ID:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "${URL:-Named Cloudflare tunnel (see your Cloudflare dashboard)}" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL"

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/id_deploy carbon-glint.env
