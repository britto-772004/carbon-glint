        field:
          type: string
        message:
          type: string
    DataSourceStatus:
      type: string
      enum: [uploaded, importing, imported, failed]
    DataSource:
      type: object
      additionalProperties: false
      required:
        [
          id,
          activityDefinitionId,
          fileName,
          fileType,
          fileSize,
          sheets,
          sheetName,
          headerRow,
          columns,
          preview,
          rowCount,
          mapping,
          mappingMode,
          status,
          importedCount,
          errorCount,
          errors,
          importedAt,
          createdAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        activityDefinitionId:
          type: string
          format: uuid
        fileName:
          type: string
        fileType:
          type: string
          enum: [csv, xlsx]
        fileSize:
          type: integer
        sheets:
          type: array
          items:
            type: string
        sheetName:
          type: [string, 'null']
        headerRow:
          type: integer
          minimum: 1
        columns:
          type: array
          items:
            type: string
        preview:
          description: First rows below the header (aligned to columns)
          type: array
          items:
            type: array
            items:
              type: string
        rowCount:
          type: integer
        mapping:
          oneOf:
            - $ref: '#/components/schemas/ColumnMapping'
            - type: 'null'
        mappingMode:
          type: [string, 'null']
          enum: [ai, manual, null]
        status:
          $ref: '#/components/schemas/DataSourceStatus'
