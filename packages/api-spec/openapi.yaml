openapi: 3.1.0
info:
  title: Carbon Glint API
  version: 0.1.0
  description: |
    Single source of truth for the Carbon Glint API.

    - The backend mounts routes and validates requests/responses directly from this file
      (express-openapi-validator). Each operation's `operationId` maps to a handler.
    - The web client SDK (`@carbon-glint/sdk`) is generated from this file.
    - Never hand-write DTOs in the backend or frontend — change this spec and regenerate.
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: /api
    description: Same-origin (Firebase Hosting rewrites /api/** to Cloud Run)
tags:
  - name: system
    description: Operational endpoints
  - name: auth
    description: Sign-up, verification, sessions and passwords
  - name: tenant
    description: The signed-in company (tenant) and onboarding
  - name: users
    description: Colleagues and invitations inside a tenant
  - name: platform
    description: Global super-admin console across all tenants
  - name: reference
    description: Reference data (industries, …)
  - name: org-units
    description: Business units (branches, plants, campuses) as a tree
  - name: activities
    description: GHG taxonomy, Activity Definitions, data sources and activity rows
  - name: emissions
    description: Emission factor library, calculated emissions, traceability, overrides and aggregations
  - name: reports
    description: Country-format ESG reports (PDF)
# Default: public. Protected operations declare `security` explicitly.
# cookieAuth "scopes" are roles: [] = any signed-in user, [admin] = tenant admin, [superadmin] = platform operator.
security: []
paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Service health
      description: Reports liveness of the API and the status of its dependencies.
      responses:
        '200':
          description: Health report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Error'
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Sign up with a work email
      description: Creates an unverified account and emails a verification link. The first verified user of a domain creates the company (tenant).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify an email address and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Re-send the verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      operationId: logIn
      tags: [auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInRequest'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logOut
      tags: [auth]
      summary: Sign out (ends the current session)
      responses:
        '204':
          description: Signed out
        default:
          $ref: '#/components/responses/Error'
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Email a new password
      description: Always returns 202 so it can't be used to discover accounts. If the account exists, a new random password is emailed and all sessions are revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '429':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the signed-in user's password
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The signed-in user and their company
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /industries:
    get:
      operationId: listIndustries
      tags: [reference]
      summary: Industries (for onboarding)
      responses:
        '200':
          description: Industries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Industry'
        default:
          $ref: '#/components/responses/Error'
  /tenant:
    get:
      operationId: getTenant
      tags: [tenant]
      summary: The signed-in company
      security:
        - cookieAuth: [admin]
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        default:
          $ref: '#/components/responses/Error'
  /tenant/onboarding:
    put:
      operationId: completeOnboarding
      tags: [tenant]
      summary: Save onboarding answers (first sign-in)
      security:
        - cookieAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '200':
          description: Onboarded tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Colleagues in this company
      security:
        - cookieAuth: [admin]
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Error'
  /users/{userId}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Enable or disable a colleague
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /invitations:
    get:
      operationId: listInvitations
      tags: [users]
      summary: Pending invitations
      security:
        - cookieAuth: [admin]
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createInvitation
      tags: [users]
      summary: Invite a colleague by email
      security:
        - cookieAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      tags: [users]
      summary: Revoke a pending invitation
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '204':
          description: Revoked
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /invitations/{invitationId}/resend:
    post:
      operationId: resendInvitation
      tags: [users]
      summary: Re-send an invitation email (new link, new expiry)
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: Invitation re-sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /invitations/lookup:
    post:
      operationId: lookupInvitation
      tags: [users]
      summary: Who an invitation link is for (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Invitation preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [users]
      summary: Accept an invitation, set a password and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          $ref: '#/components/responses/Session'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /platform/tenants:
    get:
      operationId: listPlatformTenants
      tags: [platform]
      summary: All companies (super admin)
      security:
        - cookieAuth: [superadmin]
      parameters:
        - name: q
          in: query
          description: Search by name or domain
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TenantStatus'
      responses:
        '200':
          description: Tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantSummary'
        default:
          $ref: '#/components/responses/Error'
  /platform/tenants/{tenantId}:
    get:
      operationId: getPlatformTenant
      tags: [platform]
      summary: One company with its users (super admin)
      security:
        - cookieAuth: [superadmin]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Tenant detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDetail'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updatePlatformTenant
      tags: [platform]
      summary: Enable or disable a company (super admin)
      security:
        - cookieAuth: [superadmin]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantStatusRequest'
      responses:
        '200':
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSummary'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /platform/users/{userId}:
    patch:
      operationId: updatePlatformUser
      tags: [platform]
      summary: Enable or disable any user (super admin)
      security:
        - cookieAuth: [superadmin]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /platform/users/{userId}/resend-verification:
    post:
      operationId: platformResendVerification
      tags: [platform]
      summary: Re-send a user's verification email (super admin)
      security:
        - cookieAuth: [superadmin]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /org-units:
    get:
      operationId: listOrgUnits
      tags: [org-units]
      summary: All business units of the company (flat list; build the tree with parentId)
      security:
        - cookieAuth: [admin]
      responses:
        '200':
          description: Org units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgUnit'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createOrgUnit
      tags: [org-units]
      summary: Create a business unit (root or child)
      security:
        - cookieAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgUnitRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /org-units/{orgUnitId}:
    patch:
      operationId: updateOrgUnit
      tags: [org-units]
      summary: Update or re-parent a business unit
      description: Set `parentId` to move the unit (and its subtree). Moving a unit under itself or its descendants is rejected.
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/OrgUnitId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgUnitRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgUnit'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteOrgUnit
      tags: [org-units]
      summary: Delete a business unit with no children
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/OrgUnitId'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /ghg-categories:
    get:
      operationId: listGhgCategories
      tags: [activities]
      summary: GHG categories (system + the company's custom ones), with industry recommendations
      security:
        - cookieAuth: [admin]
      parameters:
        - name: scope
          in: query
          schema:
            $ref: '#/components/schemas/Scope'
      responses:
        '200':
          description: Categories ordered by scope, recommendation rank, then name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GhgCategory'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createGhgCategory
      tags: [activities]
      summary: Add a custom category under a scope
      security:
        - cookieAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGhgCategoryRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GhgCategory'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /activity-definitions:
    get:
      operationId: listActivityDefinitions
      tags: [activities]
      summary: Activity Definitions
      security:
        - cookieAuth: [admin]
      parameters:
        - name: scope
          in: query
          schema:
            $ref: '#/components/schemas/Scope'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ActivityDefinitionStatus'
      responses:
        '200':
          description: Activity Definitions (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityDefinition'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createActivityDefinition
      tags: [activities]
      summary: Create an Activity Definition (draft)
      security:
        - cookieAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivityDefinitionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDefinition'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /activity-definitions/{activityDefinitionId}:
    get:
      operationId: getActivityDefinition
      tags: [activities]
      summary: One Activity Definition with its data sources
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/ActivityDefinitionId'
      responses:
        '200':
          description: Activity Definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDefinitionDetail'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateActivityDefinition
      tags: [activities]
      summary: Update an Activity Definition (scope/category only while draft)
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/ActivityDefinitionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActivityDefinitionRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDefinition'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteActivityDefinition
      tags: [activities]
      summary: Delete a draft Activity Definition and its data
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/ActivityDefinitionId'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /activity-definitions/{activityDefinitionId}/publish:
    post:
      operationId: publishActivityDefinition
      tags: [activities]
      summary: Publish — locks the definition and starts emission factor matching and calculation
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/ActivityDefinitionId'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityDefinition'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /activity-definitions/{activityDefinitionId}/data-sources:
    post:
      operationId: uploadDataSource
      tags: [activities]
      summary: Upload a CSV or XLSX source sheet
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/ActivityDefinitionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Parsed data source (sheets, detected header, columns, preview, suggested mapping)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /activity-definitions/{activityDefinitionId}/activities:
    get:
      operationId: listActivities
      tags: [activities]
      summary: Activity rows of a definition (paginated)
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/ActivityDefinitionId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Page of activities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /data-sources/{dataSourceId}:
    get:
      operationId: getDataSource
      tags: [activities]
      summary: Data source status (poll while importing)
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/DataSourceId'
      responses:
        '200':
          description: Data source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateDataSourceLayout
      tags: [activities]
      summary: Choose another sheet or header row (re-parses the stored file)
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/DataSourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDataSourceLayoutRequest'
      responses:
        '200':
          description: Re-parsed data source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteDataSource
      tags: [activities]
      summary: Delete a data source and its imported activities
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/DataSourceId'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /data-sources/{dataSourceId}/suggest-mapping:
    post:
      operationId: suggestColumnMapping
      tags: [activities]
      summary: Infer the column mapping (Gemini when configured, header heuristics otherwise)
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/DataSourceId'
      responses:
        '200':
          description: Suggested mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingSuggestion'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /data-sources/{dataSourceId}/import:
    post:
      operationId: importDataSource
      tags: [activities]
      summary: Validate rows with the confirmed mapping and import them (background job)
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/DataSourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportDataSourceRequest'
      responses:
        '202':
          description: Import started — poll getDataSource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /templates/activity-data:
    get:
      operationId: downloadActivityTemplate
      tags: [activities]
      summary: Sample activity data template (XLSX or CSV)
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [xlsx, csv]
            default: xlsx
      responses:
        '200':
          description: Template file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /emission-factors/sources:
    get:
      operationId: listEmissionFactorSources
      tags: [emissions]
      summary: Loaded emission factor databases
      security:
        - cookieAuth: [admin]
      responses:
        '200':
          description: Sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmissionFactorSource'
        default:
          $ref: '#/components/responses/Error'
  /emission-factors/search:
    get:
      operationId: searchEmissionFactors
      tags: [emissions]
      summary: Full-text + fuzzy search in the factor library
      security:
        - cookieAuth: [admin]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: unit
          in: query
          description: Only factors convertible from this activity unit
          schema:
            type: string
        - name: scope
          in: query
          schema:
            $ref: '#/components/schemas/Scope'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Ranked factors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FactorSearchHit'
        default:
          $ref: '#/components/responses/Error'
  /emission-factors/{factorId}:
    get:
      operationId: getEmissionFactor
      tags: [emissions]
      summary: One emission factor
      security:
        - cookieAuth: [admin]
      parameters:
        - name: factorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Factor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmissionFactor'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /emissions:
    get:
      operationId: listEmissions
      tags: [emissions]
      summary: Calculated emissions per activity (filterable)
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/ScopeFilter'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/AdFilter'
        - $ref: '#/components/parameters/OrgUnitFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/FromFilter'
        - $ref: '#/components/parameters/ToFilter'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Page of emissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmissionPage'
        default:
          $ref: '#/components/responses/Error'
  /emissions/summary:
    get:
      operationId: getEmissionsSummary
      tags: [emissions]
      summary: KPI totals for the filters
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/ScopeFilter'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/AdFilter'
        - $ref: '#/components/parameters/OrgUnitFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/FromFilter'
        - $ref: '#/components/parameters/ToFilter'
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmissionSummary'
        default:
          $ref: '#/components/responses/Error'
  /emissions/heatmap:
    get:
      operationId: getEmissionsHeatmap
      tags: [emissions]
      summary: 'Lasagne heatmap — rows = group, columns = time buckets'
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/ScopeFilter'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/AdFilter'
        - $ref: '#/components/parameters/OrgUnitFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/FromFilter'
        - $ref: '#/components/parameters/ToFilter'
        - name: groupBy
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/HeatmapGroupBy'
        - name: bucket
          in: query
          schema:
            type: string
            enum: [month, quarter, year]
            default: month
      responses:
        '200':
          description: Heatmap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Heatmap'
        default:
          $ref: '#/components/responses/Error'
  /emissions/org-tree:
    get:
      operationId: getEmissionsOrgTree
      tags: [emissions]
      summary: Business unit tree with own and rolled-up emissions per scope
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/ScopeFilter'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/AdFilter'
        - $ref: '#/components/parameters/OrgUnitFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/FromFilter'
        - $ref: '#/components/parameters/ToFilter'
      responses:
        '200':
          description: Org tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgEmissionNode'
        default:
          $ref: '#/components/responses/Error'
  /emissions/{activityId}/trace:
    get:
      operationId: getEmissionTrace
      tags: [emissions]
      summary: GHG traceability tree for one activity
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      responses:
        '200':
          description: Trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmissionTrace'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /emissions/{activityId}/override:
    delete:
      operationId: revertEmissionOverride
      tags: [emissions]
      summary: Revert the override and recalculate the activity
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      responses:
        '200':
          description: Recalculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmissionRow'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: overrideEmission
      tags: [emissions]
      summary: Override the factor or result of one activity (reason required)
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideRequest'
      responses:
        '200':
          description: Overridden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmissionRow'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /emissions/bulk-override:
    post:
      operationId: bulkOverrideEmissions
      tags: [emissions]
      summary: Apply one library factor to many activities
      security:
        - cookieAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkOverrideRequest'
      responses:
        '200':
          description: Overridden rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmissionRow'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /reports/formats:
    get:
      operationId: listReportFormats
      tags: [reports]
      summary: Available country / framework report formats
      security:
        - cookieAuth: [admin]
      responses:
        '200':
          description: Formats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportFormat'
        default:
          $ref: '#/components/responses/Error'
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: Generated reports (newest first)
      security:
        - cookieAuth: [admin]
      responses:
        '200':
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createReport
      tags: [reports]
      summary: Generate a PDF report for a business unit (background job)
      security:
        - cookieAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '202':
          description: Queued — poll getReport
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /reports/{reportId}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Report status
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteReport
      tags: [reports]
      summary: Delete a report and its PDF
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /reports/{reportId}/download:
    get:
      operationId: downloadReport
      tags: [reports]
      summary: Download the PDF
      security:
        - cookieAuth: [admin]
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cg_session
      description: httpOnly session cookie set by logIn / verifyEmail / acceptInvitation.
  parameters:
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActivityId:
      name: activityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScopeFilter:
      name: scope
      in: query
      schema:
        $ref: '#/components/schemas/Scope'
    CategoryFilter:
      name: categoryId
      in: query
      schema:
        type: string
        format: uuid
    AdFilter:
      name: activityDefinitionId
      in: query
      schema:
        type: string
        format: uuid
    OrgUnitFilter:
      name: orgUnitId
      in: query
      description: Business unit including all of its sub-units
      schema:
        type: string
        format: uuid
    StatusFilter:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/CalculationStatus'
    FromFilter:
      name: from
      in: query
      description: Period overlap start (inclusive)
      schema:
        $ref: '#/components/schemas/IsoDate'
    ToFilter:
      name: to
      in: query
      description: Period overlap end (inclusive)
      schema:
        $ref: '#/components/schemas/IsoDate'
    ActivityDefinitionId:
      name: activityDefinitionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DataSourceId:
      name: dataSourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrgUnitId:
      name: orgUnitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Accepted:
      description: Accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Session:
      description: Signed in. Sets the `cg_session` cookie.
      headers:
        Set-Cookie:
          description: Session cookie
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Me'
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ReportFormat:
      type: object
      additionalProperties: false
      required: [code, name, region, framework, description]
      properties:
        code:
          type: string
        name:
          type: string
        region:
          type: string
        framework:
          type: string
        description:
          type: string
    ReportStatus:
      type: string
      enum: [queued, generating, ready, failed]
    Report:
      type: object
      additionalProperties: false
      required:
        [id, orgUnitId, orgUnitName, format, formatName, periodStart, periodEnd, status, error, createdAt, generatedAt]
      properties:
        id:
          type: string
          format: uuid
        orgUnitId:
          type: string
          format: uuid
        orgUnitName:
          type: string
        format:
          type: string
        formatName:
          type: string
        periodStart:
          $ref: '#/components/schemas/IsoDate'
        periodEnd:
          $ref: '#/components/schemas/IsoDate'
        status:
          $ref: '#/components/schemas/ReportStatus'
        error:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        generatedAt:
          type: [string, 'null']
          format: date-time
    CreateReportRequest:
      type: object
      additionalProperties: false
      required: [orgUnitId, format, periodStart, periodEnd]
      properties:
        orgUnitId:
          type: string
          format: uuid
        format:
          type: string
          minLength: 1
          maxLength: 40
        periodStart:
          $ref: '#/components/schemas/IsoDate'
        periodEnd:
          $ref: '#/components/schemas/IsoDate'
    CalculationStatus:
      type: string
      enum: [matched, needs_review, unmatched, overridden]
    CalculationMethod:
      type: string
      enum: [ai, search, override, none]
    EmissionFactorSource:
      type: object
      additionalProperties: false
      required: [id, code, publisher, name, version, year, licence, url, factorCount, importedAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        publisher:
          type: string
        name:
          type: string
        version:
          type: string
        year:
          type: integer
        licence:
          type: string
        url:
          type: string
        factorCount:
          type: integer
        importedAt:
          type: string
          format: date-time
    EmissionFactor:
      type: object
      additionalProperties: false
      required:
        [
          id,
          sourceCode,
          sourceName,
          externalId,
          name,
          category,
          scopeHint,
          region,
          year,
          unit,
          unitLabel,
          co2ePerUnit,
          co2PerUnit,
          ch4PerUnit,
          n2oPerUnit,
          citationUrl,
        ]
      properties:
        id:
          type: string
          format: uuid
        sourceCode:
          type: string
        sourceName:
          type: string
        externalId:
          type: string
        name:
          type: string
        category:
          type: string
        scopeHint:
          type: [integer, 'null']
        region:
          type: string
        year:
          type: integer
        unit:
          type: [string, 'null']
        unitLabel:
          type: string
        co2ePerUnit:
          type: number
          description: kg CO2e per unit
        co2PerUnit:
          type: [number, 'null']
        ch4PerUnit:
          type: [number, 'null']
        n2oPerUnit:
          type: [number, 'null']
        citationUrl:
          type: string
    FactorSearchHit:
      type: object
      additionalProperties: false
      required: [factor, score]
      properties:
        factor:
          $ref: '#/components/schemas/EmissionFactor'
        score:
          type: number
    FactorRef:
      type: object
      additionalProperties: false
      required: [id, name, sourceCode, unit, co2ePerUnit, region]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sourceCode:
          type: string
        unit:
          type: [string, 'null']
        co2ePerUnit:
          type: number
        region:
          type: string
    EmissionRow:
      type: object
      additionalProperties: false
      required:
        [
          activityId,
          activityDefinitionId,
          activityDefinitionName,
          scope,
          categoryId,
          categoryName,
          orgUnitId,
          orgUnitName,
          description,
          measure,
          unit,
          periodStart,
          periodEnd,
          factor,
          method,
          status,
          confidence,
          co2eKg,
        ]
      properties:
        activityId:
          type: string
          format: uuid
        activityDefinitionId:
          type: string
          format: uuid
        activityDefinitionName:
          type: string
        scope:
          $ref: '#/components/schemas/Scope'
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        orgUnitId:
          type: [string, 'null']
          format: uuid
        orgUnitName:
          type: [string, 'null']
        description:
          type: string
        measure:
          type: number
        unit:
          type: string
        periodStart:
          $ref: '#/components/schemas/IsoDate'
        periodEnd:
          $ref: '#/components/schemas/IsoDate'
        factor:
          oneOf:
            - $ref: '#/components/schemas/FactorRef'
            - type: 'null'
        method:
          $ref: '#/components/schemas/CalculationMethod'
        status:
          $ref: '#/components/schemas/CalculationStatus'
        confidence:
          type: [number, 'null']
        co2eKg:
          type: number
    EmissionPage:
      type: object
      additionalProperties: false
      required: [items, total, totalCo2eKg]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EmissionRow'
        total:
          type: integer
        totalCo2eKg:
          type: number
    ScopeTotals:
      type: object
      additionalProperties: false
      required: ['1', '2', '3', total]
      properties:
        '1':
          type: number
        '2':
          type: number
        '3':
          type: number
        total:
          type: number
    EmissionSummary:
      type: object
      additionalProperties: false
      required: [co2eKg, activityCount, needsReview, unmatched, overridden, orgUnitsWithData, orgUnitCount]
      properties:
        co2eKg:
          $ref: '#/components/schemas/ScopeTotals'
        activityCount:
          type: integer
        needsReview:
          type: integer
        unmatched:
          type: integer
        overridden:
          type: integer
        orgUnitsWithData:
          type: integer
        orgUnitCount:
          type: integer
    HeatmapGroupBy:
      type: string
      enum: [scope, category, activityDefinition, activity, orgUnit]
    HeatmapRow:
      type: object
      additionalProperties: false
      required: [key, label, total, cells]
      properties:
        key:
          type: string
          description: Id/value to filter on when drilling down
        label:
          type: string
        total:
          type: number
        cells:
          type: array
          description: kg CO2e per column (pro-rated by days for multi-month periods)
          items:
            type: number
    Heatmap:
      type: object
      additionalProperties: false
      required: [groupBy, columns, rows, columnTotals, total]
      properties:
        groupBy:
          $ref: '#/components/schemas/HeatmapGroupBy'
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            $ref: '#/components/schemas/HeatmapRow'
        columnTotals:
          type: array
          items:
            type: number
        total:
          type: number
    OrgEmissionNode:
      type: object
      additionalProperties: false
      required: [orgUnitId, parentId, name, code, own, rollup]
      properties:
        orgUnitId:
          type: string
          format: uuid
        parentId:
          type: [string, 'null']
          format: uuid
        name:
          type: string
        code:
          type: string
        own:
          $ref: '#/components/schemas/ScopeTotals'
        rollup:
          $ref: '#/components/schemas/ScopeTotals'
    EmissionTrace:
      type: object
      description: Traceability tree — input row, classification, factor match (with alternatives), unit conversion, factor, result and overrides.
      additionalProperties: true
      required: [row, trace, overrides]
      properties:
        row:
          $ref: '#/components/schemas/EmissionRow'
        trace:
          type: object
          additionalProperties: true
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/OverrideRecord'
    OverrideRecord:
      type: object
      additionalProperties: false
      required:
        [id, type, factorId, value, unit, citation, reason, previousCo2eKg, newCo2eKg, createdBy, createdAt, revertedAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
